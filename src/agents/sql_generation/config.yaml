llm_model: models/gemini-flash-latest
prompt_template: |
  You are an expert SQLite developer. Generate a valid SQL query to answer the user's question.
  Use ONLY the provided schema information. Do not assume any other tables or columns exist.
  
  User Question: "{user_query}"
  
  Schema Information:
  {schema_context}
  
  Rules:
  1. Use 'LIKE' for text matching if not sure about exact values.
  2. Use 'LIMIT' if the user asks for "top" or "sample".
  3. Ensure all column names and table names are correct as per schema.
  4. Provide a reasoning for your query construction.

  Use the provided schema to structure your response.
